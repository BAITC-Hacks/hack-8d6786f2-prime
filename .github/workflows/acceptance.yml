name: Acceptance

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHON_DOTENV_DISABLED: '1'
      OPENAI_API_KEY: ''
      NVIDIA_API_KEY: ''
      LLM_PROVIDER: openai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
          run_install: false
      - name: Install locked dependencies
        run: |
          python -m pip install -r backend/requirements-lock.txt
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Backend and independent HTTP acceptance
        run: python -m pytest backend/tests qa -q
      - name: Schema, generated types and browser contracts
        run: |
          python scripts/export_openapi.py --check
          pnpm --dir frontend api:check
          pnpm --dir frontend test
          pnpm --dir frontend build
      - name: Fixed explanation evaluation (no API key)
        run: python qa/evaluate_explanations.py
      - name: Full browser acceptance against isolated API
        run: python qa/run_e2e.py
      - name: Record the tested delivery
        if: always()
        run: |
          mkdir -p qa/artifacts
          git rev-parse HEAD > qa/artifacts/commit.txt
          python --version > qa/artifacts/runtime.txt
          node --version >> qa/artifacts/runtime.txt
          date -u >> qa/artifacts/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-${{ github.sha }}
          path: |
            qa/artifacts
            frontend/test-results
          retention-days: 14
